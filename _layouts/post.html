<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google-site-verification" content="FBLpSrX09guXcLOpYHrWSRuOVeSzTaOWEiQ6Bztm-y0" />
<title>{{ page.title }}</title>
<link rel="canonical" href="{{ page.url | absolute_url }}" />
<meta property="og:type" content="article" />
<meta property="og:title" content="{{ page.title }}" />
<meta property="og:description" content="{{ page.description }}" />
<meta property="og:url" content="{{ page.url | absolute_url }}" />
<meta name="twitter:card" content="summary" />
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "TechArticle",
  "headline": {{ page.title | jsonify }},
  "description": {{ page.description | jsonify }},
  "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
  "author": {"@type": "Person", "name": "Chaoyi Huang", "url": "https://github.com/ChaoyiHuang"},
  "url": {{ page.url | absolute_url | jsonify }},
  "about": {
    "@type": "SoftwareApplication",
    "name": "Sandswap",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "Linux",
    "url": "https://chaoyihuang.github.io/sandswap/",
    "sameAs": [
      "https://github.com/ChaoyiHuang/sandswap",
      "https://chaoyihuang.github.io/sandswap/"
    ]
  }
}
</script>
<style>
  :root{
    --page:#f9f9f7; --surface:#fcfcfb;
    --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --hairline:#e1e0d9; --baseline:#c3c2b7; --code-bg:#f0efec;
    --accent:#2a78d6; --accent-deep:#1c5cab; --wash:#eaf2fc;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--page); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    font-size:17px; line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  body:lang(zh-CN){line-height:1.78}
  article{
    max-width:748px; margin:0 auto; padding:56px 22px 72px;
    counter-reset:sec;
  }
  .topnav{
    font-size:13.5px; color:var(--muted); margin-bottom:34px;
  }
  .topnav a{color:var(--muted); text-decoration:none}
  .topnav a:hover{color:var(--accent-deep)}
  h1{
    font-size:34px; line-height:1.16; font-weight:680; letter-spacing:-.014em;
    margin:0 0 10px;
  }
  .meta{
    font-size:13.5px; color:var(--muted); margin:0 0 40px;
    padding-bottom:14px; border-bottom:1px solid var(--baseline);
  }
  h2{
    font-size:24px; line-height:1.22; font-weight:660; letter-spacing:-.012em;
    margin:52px 0 14px; padding-top:22px; border-top:1px solid var(--hairline);
    counter-increment:sec; counter-reset:q;
  }
  article > h2::before{
    content:counter(sec) " "; color:var(--accent-deep); margin-right:10px;
  }
  h3{
    font-size:18.5px; line-height:1.3; font-weight:640; letter-spacing:-.008em;
    margin:34px 0 10px;
    counter-increment:q;
  }
  article > h3::before{
    content:counter(sec) "." counter(q) " "; color:var(--accent-deep);
    margin-right:8px; font-variant-numeric:tabular-nums;
  }
  .appendix h2::before{content:none}
  p{margin:0 0 16px}
  a{color:var(--accent-deep)}
  article strong{font-weight:660}
  code{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.86em;
    background:var(--code-bg); padding:1px 5px; border-radius:3px;
  }
  article ul{list-style:none; margin:0 0 16px; padding:0}
  article ul li{margin-bottom:9px}
  ul.refs{font-size:15px}
  ul.refs li{padding-left:18px; position:relative; margin-bottom:8px}
  ul.refs li::before{
    content:""; position:absolute; left:2px; top:.55em; width:7px; height:7px;
    background:var(--accent);
  }
  article pre{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:13px; line-height:1.42; color:var(--ink);
    margin:20px 0 22px; padding:14px 16px; border:1px solid var(--hairline);
    background:var(--surface); white-space:pre; overflow-x:auto;
  }
  article pre code{
    font-family:inherit; font-size:inherit; background:none; padding:0;
    border-radius:0;
  }
  article table{border-collapse:collapse; width:100%; font-size:14.5px; margin:18px 0 20px}
  article th{
    font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);
    font-weight:600; text-align:left; padding:6px 10px; border-bottom:1px solid var(--baseline);
  }
  article td{padding:8px 10px; border-bottom:1px solid var(--hairline); vertical-align:top; line-height:1.45}
  article tr:last-child td{border-bottom:1px solid var(--baseline)}
  .appendix{
    margin-top:52px; padding-top:22px; border-top:1px solid var(--hairline);
  }
  .appendix h2{border-top:none; margin-top:0; padding-top:0}
  .disclaimer{font-size:13.5px; color:var(--muted); margin-top:44px}
  @media (max-width:560px){
    h1{font-size:27px}
    h2{font-size:21px}
    body{font-size:16px}
  }
</style>
</head>
<body>
<article>

<nav class="topnav"><a href="https://chaoyihuang.github.io/posts/blog/">&larr; Blog</a></nav>

<h1>{{ page.title }}</h1>
<p class="meta">{{ page.date | date: "%Y-%m-%d" }} &middot; Chaoyi Huang</p>

{{ content }}

</article>
</body>
</html>
